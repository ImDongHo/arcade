<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" fill="#070a12"/>
  <line x1="0" y1="52" x2="320" y2="52" stroke="#ff4fd2" stroke-opacity=".55" stroke-width="2" stroke-dasharray="8 8"/>
  <g font-family="Consolas,monospace" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <g filter="url(#g)" fill="#0b0f19" stroke-width="3">
      <circle cx="70" cy="160" r="38" stroke="#ff4b5e"/>
      <circle cx="152" cy="168" r="30" stroke="#ff8a3d"/>
      <circle cx="226" cy="156" r="44" stroke="#ff4fd2"/>
      <circle cx="290" cy="174" r="24" stroke="#ffc44d"/>
      <circle cx="118" cy="114" r="24" stroke="#c6ff4d"/>
      <circle cx="180" cy="116" r="19" stroke="#5dffa0"/>
      <circle cx="272" cy="124" r="19" stroke="#5dffa0"/>
      <circle cx="58" cy="106" r="14" stroke="#43f0ff"/>
    </g>
    <text x="70" y="160" fill="#ff4b5e" font-size="26">64</text>
    <text x="152" y="168" fill="#ff8a3d" font-size="22">32</text>
    <text x="226" y="156" fill="#ff4fd2" font-size="28">128</text>
    <text x="290" y="174" fill="#ffc44d" font-size="18">16</text>
    <text x="118" y="114" fill="#c6ff4d" font-size="18">8</text>
    <text x="180" y="116" fill="#5dffa0" font-size="15">4</text>
    <text x="272" y="124" fill="#5dffa0" font-size="15">4</text>
    <text x="58" y="106" fill="#43f0ff" font-size="12">2</text>
    <!-- dropping ball -->
    <g filter="url(#g)">
      <circle cx="160" cy="26" r="14" fill="#0b0f19" stroke="#43f0ff" stroke-width="3">
        <animate attributeName="cy" values="22;30;22" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <line x1="160" y1="44" x2="160" y2="92" stroke="#e7eaf4" stroke-opacity=".2" stroke-dasharray="2 6"/>
  </g>
</svg>
