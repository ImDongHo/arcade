<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="cells" x="64" y="4" width="32" height="32" patternUnits="userSpaceOnUse"><rect x=".5" y=".5" width="31" height="31" fill="none" stroke="#8296c8" stroke-opacity=".1" stroke-dasharray="3 4"/></pattern>
