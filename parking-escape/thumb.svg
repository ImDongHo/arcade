    <rect x="168" y="8" width="54" height="24" rx="7" fill="#10141e" stroke="#ff4fd2"/>
    <rect x="104" y="136" width="86" height="24" rx="7" fill="#10141e" stroke="#6b9cff"/>
    <rect x="168" y="168" width="54" height="24" rx="7" fill="#10141e" stroke="#ff8a3d"/>
    <rect x="232" y="104" width="20" height="54" rx="7" fill="#10141e" stroke="#c6ff4d"/>
