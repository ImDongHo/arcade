<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>arcade</title>
<meta name="theme-color" content="#0a0c13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="arcade">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script src="shared/zoom-reset.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: arcade shelf — a header plate, then a wrapping grid of cabinet cards with live thumbnails. Single dark world by choice. */
:root{
  --bg:#0a0c13; --panel:#10141e; --line:#20283a; --fg:#e7eaf4; --muted:#8b93ad;
  --cyan:#43f0ff; --amber:#ffc44d;
  --f-display:"Black Han Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:calc(32px + env(safe-area-inset-top,0px)) 56px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:28px}
header{display:grid;gap:6px}
.logo{font:700 clamp(34px,7vw,56px)/1 var(--f-mono);letter-spacing:-.02em;margin:0}
.logo span{color:var(--cyan);text-shadow:0 0 22px rgba(67,240,255,.5)}
.sub{margin:0;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;font:500 13px var(--f-mono);color:var(--muted)}
.bar b{color:var(--fg);font-weight:700}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{font:600 14px var(--f-body);color:var(--muted);background:#121726;border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;gap:7px}
.cat b{font:700 12px var(--f-mono);color:var(--muted)}
.cat[aria-pressed="true"]{color:#041016;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 18px -4px var(--cyan)}
.cat[aria-pressed="true"] b{color:#041016}
.cat:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (hover:hover){.cat:hover{border-color:var(--muted)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{--c:var(--cyan);display:grid;grid-template-rows:auto 1fr;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 12px 40px -14px var(--c);outline:none}
.thumb{position:relative;aspect-ratio:16/10;background:#070a12;overflow:hidden;border-bottom:1px solid var(--line)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.card:hover .thumb img{transform:scale(1.05)}
.play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;background:rgba(5,7,12,.45);transition:opacity .18s ease}
.play i{font:700 14px var(--f-body);font-style:normal;color:#041016;background:var(--c);padding:8px 18px;border-radius:999px;box-shadow:0 0 24px -4px var(--c)}
.card:hover .play,.card:focus-visible .play{opacity:1}
.chip{position:absolute;top:10px;left:10px;font:600 12px var(--f-body);padding:3px 10px;border-radius:999px;background:rgba(7,10,18,.85);border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dot)}
.chip.play-ok{--dot:#5dffa0}.chip.proto{--dot:var(--amber)}.chip.soon{--dot:var(--muted)}
.body{padding:16px 18px 18px;display:grid;gap:6px;align-content:start}
.body h2{font:400 22px/1.25 var(--f-display);margin:0;text-wrap:balance}
.body p{margin:0;color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.meta .m{font:500 12px var(--f-mono);color:var(--fg)}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.next{display:grid;place-content:center;gap:6px;text-align:center;min-height:260px;border:1.5px dashed var(--line);border-radius:16px;color:var(--muted);padding:24px}
.next b{font:700 32px var(--f-mono);color:var(--line)}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:12px}
.reset{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.reset button{font:600 13px var(--f-body);color:var(--muted);background:#121726;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;touch-action:manipulation}
.reset button.armed{color:#ffd0d6;background:#3a0f16;border-color:#ff4b5e}
.reset button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.reset span{font-size:12px}
footer code{font-family:var(--f-mono);color:var(--fg);background:#151a27;padding:1px 6px;border-radius:5px}
@media (prefers-reduced-motion:reduce){.card,.thumb img,.play{transition:none}.card:hover{transform:none}}
</style>

<div class="wrap">
  <header>
    <h1 class="logo">arcade<span>_</span></h1>
    <p class="sub">직접 만들고 직접 노는 브라우저 게임 모음</p>
    <div class="bar" id="bar"></div>
  </header>

  <nav class="cats" id="cats" aria-label="게임 분류"></nav>

  <main class="grid" id="grid"></main>

  <footer>
    <div class="reset">
      <button type="button" id="bReset">게임 기록 전체 초기화</button>
      <span id="resetMsg">최고 점수, 스테이지 진행, 이어하기를 모두 지워요. 소리·진동 설정은 그대로예요.</span>
    </div>
    <div>새 게임은 <code>games.js</code>에 한 줄 추가하면 여기에 카드로 나타나요.</div>
  </footer>
</div>

<script src="games.js"></script>
<script>
const LABEL={play:'플레이 가능',proto:'프로토타입',soon:'준비 중'};
const CLS={play:'play-ok',proto:'proto',soon:'soon'};
const games=window.GAMES||[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// categories shown as filter buttons; add a line here when a new kind of game arrives
const CATS=[{id:'all',name:'전체'},{id:'puzzle',name:'퍼즐'},{id:'arcade',name:'아케이드'}];
const grid=document.getElementById('grid');
let cur=(()=>{const h=location.hash.slice(1);if(CATS.some(c=>c.id===h))return h;try{return localStorage.getItem('home_cat')||'all'}catch(e){return'all'}})();
if(!CATS.some(c=>c.id===cur))cur='all';
function draw(){
const list=cur==='all'?games:games.filter(g=>g.category===cur);
document.getElementById('cats').innerHTML=CATS.filter(c=>c.id==='all'||games.some(g=>g.category===c.id)).map(c=>{
  const k=c.id==='all'?games.length:games.filter(g=>g.category===c.id).length;
  return`<button class="cat" type="button" data-cat="${c.id}" aria-pressed="${c.id===cur}">${esc(c.name)}<b>${k}</b></button>`}).join('');
grid.innerHTML=list.map(g=>`
  <a class="card" href="${esc(g.url)}" style="--c:${esc(g.color||'#43f0ff')}" aria-label="${esc(g.title)} 플레이">
    <div class="thumb">
      <img src="${esc(g.thumb)}" alt="" loading="lazy">
      <span class="chip ${CLS[g.status]||'soon'}">${LABEL[g.status]||''}</span>
      <div class="play"><i>▶ 플레이</i></div>
    </div>
    <div class="body">
      <h2>${esc(g.title)}</h2>
      <p>${esc(g.desc)}</p>
      <div class="meta">${g.meta?`<span class="m">${esc(g.meta)}</span>`:''}${(g.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div>
  </a>`).join('')+`
  <div class="next"><b>+</b><span>다음 게임 자리</span></div>`;
}
document.getElementById('cats').addEventListener('click',e=>{const b=e.target.closest('.cat');if(!b)return;cur=b.dataset.cat;try{localStorage.setItem('home_cat',cur)}catch(_){}
  history.replaceState(null,'',cur==='all'?location.pathname:'#'+cur);draw()});
draw();
const n=s=>games.filter(g=>g.status===s).length;
document.getElementById('bar').innerHTML=`<span>게임 <b>${games.length}</b>개</span><span>플레이 가능 <b>${n('play')}</b></span><span>프로토타입 <b>${n('proto')}</b></span>`;

/* reset all game records — only the exact keys our games use, so nothing else stored on this browser is touched.
   (When a new game saves something, add its key here.) */
const RECORD_KEYS=[
  'lm_progress','lm_stage',                  // 레이저 거울 반사
  'pk_progress','pk_stage2',                 // 주차장 탈출
  'mg_best','mg_save',                       // 네온 머지
  'bb_best','bb_save',                       // 네온 버블
  'ns_best2','ns_bestF',                     // 네온 스택
  'cs_progress',                             // 색 정렬 튜브
  'oj_best',                                 // 궤도 점프
  'os_done','os_last',                       // 한붓그리기
  't48_best','t48_save',                     // 네온 2048
];
{const b=document.getElementById('bReset'),m=document.getElementById('resetMsg'),base=m.textContent;let armed=0,timer=0;
 const disarm=()=>{armed=0;clearTimeout(timer);b.textContent='게임 기록 전체 초기화';b.classList.remove('armed')};
 b.addEventListener('click',()=>{
   if(!armed){armed=1;b.textContent='한 번 더 누르면 지워져요';b.classList.add('armed');m.textContent='정말 모든 게임 기록을 지울까요? 되돌릴 수 없어요.';timer=setTimeout(()=>{disarm();m.textContent=base},3000);return}
   let n=0;for(const k of RECORD_KEYS){try{if(localStorage.getItem(k)!=null){localStorage.removeItem(k);n++}}catch(e){}}
   disarm();m.textContent=n?`기록 ${n}개를 지웠어요. 모든 게임이 처음 상태로 돌아갔어요.`:'지울 기록이 없어요.';
 });}
</script>
</html>
